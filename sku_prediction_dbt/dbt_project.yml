name: sku_prediction_dbt

profile: grzegorz_profile

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  sku_prediction_dbt:
    +schema: raw

models:
    sku_prediction_dbt:
      silver_sku:
        +schema: silver_sku
        +materialized: table
      gold_sku:
        +schema: gold_sku
        +materialized: table
