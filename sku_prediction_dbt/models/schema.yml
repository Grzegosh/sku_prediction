models:
  - name: dim_date
    columns:
      - name: date
        data_tests:
          - unique
          - not_null

  - name: dim_holiday
    columns:  
      - name: date
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date

  - name: dim_special_day
    columns:
      - name: date
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date

  - name: fact_weather
    columns:
      - name: date
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date
      - name: temperature_c
        data_tests:
          - not_null

  - name: dim_category
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: dim_product
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - sku_id
              - valid_from
    columns:
      - name: sku_id
        data_tests:
          - not_null
      - name: valid_from
        data_tests:
          - not_null

  - name: dim_customer
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - id
              - valid_from
    columns:
      - name: id
        data_tests:
          - not_null
      - name: valid_from
        data_tests:
          - not_null

  - name: fact_sales
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - order_id
              - order_line_id
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_line_id
        data_tests:
          - not_null
      - name: sku_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null

  - name: fact_sales_agg_daily_sku_channel
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - sku_id
              - channel

  - name: fact_sales_agg_daily_sku
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - sku_id
    columns:
      - name: date
        data_tests:
          - not_null
      - name: sku_id
        data_tests:
          - not_null

  - name: fact_sales_agg_daily_channel
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - channel
    columns:
      - name: date
        data_tests:
          - not_null
      - name: channel
        data_tests:
          - not_null

  - name: fact_sales_agg_daily
    columns:
      - name: date
        data_tests:
          - not_null
          - unique

  - name: dim_discount
    columns:
      - name: date
        data_tests:
          - not_null
          - unique