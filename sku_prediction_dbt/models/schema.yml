models:
  - name: dim_date
    columns:
      - name: date
        data_tests:
          - unique
          - not_null

  - name: dim_holiday
    columns:  
      - name: date
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date

  - name: dim_special_day
    columns:
      - name: date
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date

  - name: dim_temperature
    columns:
      - name: date
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date

  - name: dim_category
    columns:
      - name: id
        data_tests:
          - unique
          - not_null

  - name: dim_product
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - sku_id
              - valid_from
    columns:
      - name: sku_id
        data_tests:
          - not_null
      - name: valid_from
        data_tests:
          - not_null

  - name: dim_customer
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - id
              - valid_from
    columns:
      - name: id
        data_tests:
          - not_null
      - name: valid_from
        data_tests:
          - not_null

  - name: fact_sales
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - order_id
              - order_line_id
              - sku_id
              - customer_id
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_line_id
        data_tests:
          - not_null
      - name: sku_id
        data_tests:
          - not_null
      - name: customer_id
        data_tests:
          - not_null
